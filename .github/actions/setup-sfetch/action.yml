---
# setup-sfetch — verified sfetch bootstrap for GitHub Actions
#
# Public contract (additive-only inputs after first release):
#   sfetch-version  (required)  exact tag in this action SHA's supported range
#   goneat-version  (optional)  exact tag; no floating default
#   install-dir     (optional)  binary install directory
#
# Trust model:
#   Consumers pin this action by commit SHA (not a moving tag). That SHA is the
#   TCB for the verification engine — same model as actions/checkout.
#   The engine script is colocated under GITHUB_ACTION_PATH (this directory).
#   Never resolved from GITHUB_WORKSPACE (consumer repo contents cannot replace it).
#   The sfetch trust anchor is embedded in the engine script; never fetched from
#   the release being authenticated.
#
# Dual-route (selected by sfetch-version; logged; no silent fallback):
#   >= v0.4.11 → install-sfetch.sh.minisig
#   <  v0.4.11 → signed SHA256SUMS + installer hash
#
# Fail-closed: no continue-on-error, no || true soft skips, no @latest tools,
# no Go toolchain requirement, no ambient minisign preference, no workspace
# engine fallback.
#
# Supported sfetch-version range is declared by the engine revision shipped with
# this action SHA (see bootstrap-sfetch-verified.sh constants).
name: "Setup sfetch"
description: "Install a pinned, minisign-verified sfetch (optional goneat) without pipe-to-bash"
author: "3leaps"

inputs:
  sfetch-version:
    description: >-
      Exact sfetch release tag (vMAJOR.MINOR.PATCH). Required. Never "latest". Must fall within the supported range of this action commit SHA.
    required: true
  goneat-version:
    description: >-
      Optional exact goneat release tag to install via verified sfetch after sfetch is installed. Empty means skip goneat. Never "latest".
    required: false
    default: ""
  install-dir:
    description: >-
      Directory for installed binaries. Default: $HOME/.local/bin (created).
    required: false
    default: ""

outputs:
  sfetch-bin:
    description: "Absolute path to the installed sfetch binary"
    value: ${{ steps.install.outputs.sfetch-bin }}
  goneat-bin:
    description: "Absolute path to goneat when goneat-version was set"
    value: ${{ steps.install.outputs.goneat-bin }}
  route:
    description: "Verification route taken (minisig or sha256sums)"
    value: ${{ steps.install.outputs.route }}

runs:
  using: composite
  steps:
    - name: Verified sfetch install
      id: install
      shell: bash
      env:
        INPUT_SFETCH_VERSION: ${{ inputs.sfetch-version }}
        INPUT_GONEAT_VERSION: ${{ inputs.goneat-version }}
        INPUT_INSTALL_DIR: ${{ inputs.install-dir }}
      run: |
        set -euo pipefail

        # Resolve engine only beneath GITHUB_ACTION_PATH (action-owned TCB).
        # Never fall back to GITHUB_WORKSPACE — consumer repo contents must not
        # replace the pinned action's verification engine.
        ACTION_ROOT="${GITHUB_ACTION_PATH}"
        ENGINE="${ACTION_ROOT}/bootstrap-sfetch-verified.sh"
        if [ ! -f "${ENGINE}" ] || [ ! -r "${ENGINE}" ]; then
          echo "error: action-owned engine missing or unreadable: ${ENGINE}" >&2
          exit 1
        fi
        # Require a regular file (reject unexpected directory / special nodes).
        if [ ! -f "${ENGINE}" ] || [ -d "${ENGINE}" ]; then
          echo "error: action-owned engine is not a regular file: ${ENGINE}" >&2
          exit 1
        fi
        ENGINE="$(cd "$(dirname "${ENGINE}")" && pwd)/$(basename "${ENGINE}")"
        case "${ENGINE}" in
          "${ACTION_ROOT}"/* | "$(cd "${ACTION_ROOT}" && pwd)"/*) ;;
          *)
            echo "error: engine resolved outside GITHUB_ACTION_PATH: ${ENGINE}" >&2
            exit 1
            ;;
        esac
        chmod +x "${ENGINE}"

        # Scrub test-only override variables so production action path cannot be
        # weakened by ambient job env (pinned archive always; no BASE_URL hijack).
        unset SFETCH_BOOTSTRAP_SKIP_MINISIGN_INSTALL
        unset SFETCH_BOOTSTRAP_BASE_URL

        VERSION="${INPUT_SFETCH_VERSION:-}"
        if [ -z "${VERSION}" ]; then
          echo "error: sfetch-version is required" >&2
          exit 1
        fi
        case "${VERSION}" in
          latest|LATEST|main|master|HEAD|"")
            echo "error: sfetch-version must be an exact tag (refusing ${VERSION:-empty})" >&2
            exit 1
            ;;
        esac

        DIR="${INPUT_INSTALL_DIR:-}"
        if [ -z "${DIR}" ]; then
          DIR="${HOME}/.local/bin"
        fi
        mkdir -p "${DIR}"

        ARGS=(--version "${VERSION}" --dir "${DIR}" --yes)
        if [ -n "${INPUT_GONEAT_VERSION:-}" ]; then
          case "${INPUT_GONEAT_VERSION}" in
            latest|LATEST)
              echo "error: goneat-version must be an exact tag (refusing ${INPUT_GONEAT_VERSION})" >&2
              exit 1
              ;;
          esac
          ARGS+=(--goneat-version "${INPUT_GONEAT_VERSION}")
        fi

        # Capture route from stderr log while still failing closed on non-zero.
        LOG="$(mktemp)"
        set +e
        OUT="$("${ENGINE}" "${ARGS[@]}" 2>"${LOG}")"
        RC=$?
        set -e
        cat "${LOG}" >&2
        if [ "${RC}" -ne 0 ]; then
          echo "error: verified bootstrap failed (exit ${RC})" >&2
          rm -f "${LOG}"
          exit "${RC}"
        fi

        # Require exactly one valid terminal route line (fail closed; no soft empty).
        set +e
        ROUTE_LINES="$(grep -E 'route=(minisig|sha256sums)([[:space:]]|$)' "${LOG}")"
        GREP_RC=$?
        set -e
        if [ "${GREP_RC}" -ne 0 ] || [ -z "${ROUTE_LINES}" ]; then
          echo "error: no route=(minisig|sha256sums) log line from engine" >&2
          rm -f "${LOG}"
          exit 1
        fi
        ROUTE_COUNT="$(printf '%s\n' "${ROUTE_LINES}" | grep -c .)"
        if [ "${ROUTE_COUNT}" -ne 1 ]; then
          echo "error: expected exactly one route=(minisig|sha256sums) log line, got ${ROUTE_COUNT}" >&2
          rm -f "${LOG}"
          exit 1
        fi
        ROUTE="$(printf '%s\n' "${ROUTE_LINES}" | sed -E 's/.*route=(minisig|sha256sums).*/\1/')"
        case "${ROUTE}" in
          minisig|sha256sums) ;;
          *)
            echo "error: invalid route value: ${ROUTE}" >&2
            rm -f "${LOG}"
            exit 1
            ;;
        esac

        SFETCH_BIN="$(printf '%s\n' "${OUT}" | awk -F= '/^sfetch-bin=/{print $2; exit}')"
        GONEAT_BIN="$(printf '%s\n' "${OUT}" | awk -F= '/^goneat-bin=/{print $2; exit}')"
        rm -f "${LOG}"

        if [ -z "${SFETCH_BIN}" ] || [ ! -f "${SFETCH_BIN}" ]; then
          echo "error: sfetch binary path missing after bootstrap" >&2
          exit 1
        fi

        # Exact version token check on installed binary (reuse engine rules).
        REPORT="$("${SFETCH_BIN}" --version 2>&1)" || {
          echo "error: sfetch --version failed after bootstrap" >&2
          exit 1
        }
        VER_NUM="${VERSION#v}"
        ESC="$(printf '%s' "${VER_NUM}" | sed 's/\./\\./g')"
        if ! printf '%s\n' "${REPORT}" | grep -Eq "(^|[^0-9])v?${ESC}([^0-9]|$)"; then
          echo "error: sfetch version assertion failed: expected ${VERSION}, got: ${REPORT}" >&2
          exit 1
        fi

        if [ -n "${INPUT_GONEAT_VERSION:-}" ]; then
          if [ -z "${GONEAT_BIN}" ] || [ ! -f "${GONEAT_BIN}" ]; then
            echo "error: goneat was requested but binary path missing after bootstrap" >&2
            exit 1
          fi
          GREP="$("${GONEAT_BIN}" version 2>&1 | head -n1)" || {
            echo "error: goneat version command failed" >&2
            exit 1
          }
          GNUM="${INPUT_GONEAT_VERSION#v}"
          GESC="$(printf '%s' "${GNUM}" | sed 's/\./\\./g')"
          if ! printf '%s\n' "${GREP}" | grep -Eq "(^|[^0-9])v?${GESC}([^0-9]|$)"; then
            echo "error: goneat version assertion failed: expected ${INPUT_GONEAT_VERSION}, got: ${GREP}" >&2
            exit 1
          fi
        fi

        echo "${DIR}" >> "${GITHUB_PATH}"
        {
          echo "sfetch-bin=${SFETCH_BIN}"
          echo "goneat-bin=${GONEAT_BIN}"
          echo "route=${ROUTE}"
        } >> "${GITHUB_OUTPUT}"

        echo "setup-sfetch complete: version=${VERSION} route=${ROUTE} sfetch-bin=${SFETCH_BIN}"
