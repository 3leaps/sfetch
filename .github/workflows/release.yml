---
name: Release

'on':
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  NAME: sfetch

jobs:
  create_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      # softprops/action-gh-release@v3 (Node 24) replaces the archived,
      # Node12-era actions/create-release@v1 + actions/upload-release-asset@v1
      # and the Node-20 softprops/action-gh-release@v2 pin. It creates the
      # release for the pushed tag (idempotent) and uploads the install script.
      # The build matrix below appends per-platform archives to the same release.
      # Maintainer signs + adds SHA256SUMS/notes afterward via scripts/
      # (see README "Manual signing workflow").
      # Draft until maintainer signs install-sfetch.sh + manifests and uploads
      # via make release-upload. A published release without installer .minisig is
      # non-consumable for verified bootstrap; draft keeps it off "latest".
      - name: Create draft release and upload install script
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          name: sfetch ${{ github.ref_name }}
          body: |
            ## sfetch ${{ github.ref_name }}
            Draft release — incomplete until maintainer signs and publishes.

            Do not bootstrap from this release until `install-sfetch.sh.minisig`
            and signed checksum manifests are uploaded, then the release is
            published (`gh release edit TAG --draft=false`).
          draft: true
          prerelease: false
          files: scripts/install-sfetch.sh

  build:
    needs: create_release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Validate VERSION matches tag
        run: |
          FILE_VERSION=$(cat VERSION)
          TAG_VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION file: $FILE_VERSION"
          echo "Git tag: $TAG_VERSION"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            MSG="VERSION ($FILE_VERSION) != tag ($TAG_VERSION)"
            echo "::error::$MSG"
            exit 1
          fi

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: '1.26.8'

      - name: License check
        # go-licenses v1.6.0 errors on stdlib packages ("Package fmt does not
        # have module info"), which is a tool regression unrelated to our
        # dependencies. Pin to v1.5.0 — the last version that silently
        # skipped stdlib — until a working successor lands.
        run: |
          go install github.com/google/go-licenses@v1.5.0
          REPORT=$(go-licenses csv ./...)
          echo "$REPORT"
          if echo "$REPORT" | grep -E "(GPL|AGPL)" >/dev/null 2>&1; then
            echo "GPL/AGPL detected—blocked"
            exit 1
          fi

      - name: Install release dependencies
        run: sudo apt-get update && sudo apt-get install -y zip gnupg


      - name: Build
        run: make build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          ASSET="sfetch_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            ARCHIVE="${ASSET}.zip"
            (cd bin && mv "${ASSET}.exe" "sfetch.exe")
            zip -j "${ARCHIVE}" "bin/sfetch.exe"
            (cd bin && mv "sfetch.exe" "${ASSET}.exe")
            CONTENT_TYPE="application/zip"
          else
            ARCHIVE="${ASSET}.tar.gz"
            (cd bin && mv "${ASSET}" sfetch)
            tar czf "${ARCHIVE}" -C bin sfetch
            (cd bin && mv sfetch "${ASSET}")
            CONTENT_TYPE="application/gzip"
          fi
          echo "ASSET_FILE=${ARCHIVE}" >> "$GITHUB_ENV"
          echo "ASSET_CONTENT_TYPE=${CONTENT_TYPE}" >> "$GITHUB_ENV"

      # Per-file .sha256 removed - signed SHA256SUMS is the authoritative source
      # Maintainer generates SHA256SUMS locally and signs with minisign/pgp

      # Reopens the same release as a draft while appending this matrix entry's
      # distinctly named archive. Every release-writing action must state
      # draft: true so parallel uploads cannot publish before signing.
      - name: Upload Archive
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          draft: true
          files: ${{ env.ASSET_FILE }}

      - name: Signing handled manually
        # NOTE: actionlint rejects constant expressions like `${{ false }}`.
        # Keep this step effectively disabled while leaving a breadcrumb.
        if: ${{ github.ref == 'refs/tags/__disabled__' }}
        run: echo "Signing occurs via scripts/sign-release.sh after CI"
