---
# Tag workflow is defined by the tagged commit: read-only, artifacts only.
# It never creates a GitHub Release and never signs. A green run is a
# consistency signal, not release authorization.
name: Release

'on':
  push:
    tags:
      - "v*"

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NAME: sfetch

jobs:
  verify-signature:
    name: Verify pinned tag signature
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
      tag_object: ${{ steps.verify.outputs.tag_object }}
    steps:
      - name: Checkout exact signed tag and committed pin
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Decernor
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d "$RUNNER_TEMP/decernor.XXXXXX")"
          SFETCH_DECERNOR_BIN="$(./scripts/ci-install-decernor.sh "$tool_dir")"
          case "$SFETCH_DECERNOR_BIN" in
            *$'\n'*) echo "error: Decernor install printed extra stdout" >&2; exit 1 ;;
          esac
          echo "SFETCH_DECERNOR_BIN=$SFETCH_DECERNOR_BIN" >>"$GITHUB_ENV"

      - name: Verify committed pin and GitHub signature
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          SFETCH_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -x "${SFETCH_DECERNOR_BIN:?SFETCH_DECERNOR_BIN required}"
          ./scripts/release-restore-tag-ref.sh
          SFETCH_REQUIRE_TAG=1 ./scripts/release-guard-tag-version.sh
          ./scripts/verify-pinned-tag.sh
          EXPECTED_OBJECT="$(git rev-parse "refs/tags/$SFETCH_RELEASE_TAG")"
          tag_json="$(gh api "repos/3leaps/sfetch/git/tags/$EXPECTED_OBJECT")"
          jq -e --arg tag "$SFETCH_RELEASE_TAG" --arg commit "$(git rev-parse HEAD)" \
            '.tag == $tag and .object.type == "commit" and .object.sha == $commit and
             .verification.verified == true and .verification.reason == "valid"' \
            <<<"$tag_json" >/dev/null
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"
          printf 'tag_object=%s\n' "$EXPECTED_OBJECT" >>"$GITHUB_OUTPUT"

      - name: Check committed identity with pinned Decernor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -x "${SFETCH_DECERNOR_BIN:?SFETCH_DECERNOR_BIN required}"
          ./scripts/release-verify-committed-anchors.sh

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-signature
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build only the verified tag object and commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_COMMIT: ${{ needs.verify-signature.outputs.commit }}
          SFETCH_EXPECTED_TAG_OBJECT: ${{ needs.verify-signature.outputs.tag_object }}
          SFETCH_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [ -n "$VERIFIED_COMMIT" ] && [ "$(git rev-parse HEAD)" = "$VERIFIED_COMMIT" ] || {
            echo "::error::checkout differs from the signature-verified commit"
            exit 1
          }
          ./scripts/release-restore-tag-ref.sh

      - name: Validate VERSION matches tag
        run: |
          set -euo pipefail
          FILE_VERSION=$(cat VERSION)
          TAG_VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION file: $FILE_VERSION"
          echo "Git tag: $TAG_VERSION"
          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::VERSION ($FILE_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: '1.26.10'

      - name: License check
        run: |
          go install github.com/google/go-licenses@v1.5.0
          REPORT=$(go-licenses csv ./...)
          echo "$REPORT"
          if echo "$REPORT" | grep -E "(GPL|AGPL)" >/dev/null 2>&1; then
            echo "GPL/AGPL detected—blocked"
            exit 1
          fi

      - name: Install package dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zip

      - name: Build and package artifacts
        run: make package

      - name: Upload release packages as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-packages-${{ github.ref_name }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30
