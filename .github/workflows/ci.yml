---
name: CI

'on':
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}
  GH_TOKEN: ${{ github.token }}
  SFETCH_GITHUB_TOKEN: ${{ github.token }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: '1.26.10'

      - name: Install system tools
        run: |
          sudo apt-get update && \
            sudo apt-get install -y --no-install-recommends \
            yamllint shellcheck minisign

      - name: Build sfetch (from this commit)
        run: |
          go build -o bin/sfetch .
          ./bin/sfetch --version

      - name: Install goneat via sfetch (dogfooding)
        run: |
          ./bin/sfetch --repo fulmenhq/goneat \
            --tag v0.6.6 \
            --dest-dir bin \
            --require-minisign \
            --minisign-key docs/security/fulmenhq-goneat-minisign.pub
          ./bin/goneat version

      - name: Install development tools via goneat
        run: |
          export PATH="$PWD/bin:$PATH"
          goneat doctor tools --scope foundation --install --yes || true
          goneat doctor tools --scope security --install --yes || true

      - name: Install pinned golangci-lint
        run: |
          make golangci-lint-install
          export PATH="$PWD/bin:$PATH"
          [ "$(command -v golangci-lint)" = "$PWD/bin/golangci-lint" ]

      - name: Install pinned Decernor
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/decernor-ci"
          mkdir -p "$tool_dir"
          SFETCH_DECERNOR_BIN="$(./scripts/ci-install-decernor.sh "$tool_dir")"
          case "$SFETCH_DECERNOR_BIN" in
            *$'\n'*) echo "error: Decernor install printed extra stdout" >&2; exit 1 ;;
          esac
          echo "SFETCH_DECERNOR_BIN=$SFETCH_DECERNOR_BIN" >>"$GITHUB_ENV"
          echo "Installed Decernor at $SFETCH_DECERNOR_BIN"

      - name: Install pinned gosec
        run: |
          make gosec-install
          export PATH="$PWD/bin:$PATH"
          [ "$(command -v gosec)" = "$PWD/bin/gosec" ]

      - name: Quality
        run: |
          export PATH="$PWD/bin:$PATH"
          test -x "${SFETCH_DECERNOR_BIN:?SFETCH_DECERNOR_BIN required}"
          make precommit

      - name: Assert version on packaged artifact
        run: |
          set -euo pipefail
          ./scripts/test-version-ldflags.sh --packaged

      # Pin to Makefile SFETCH_VERSION (N-1 fully-signed release), never latest.
      # Main CI after a release tag races incomplete asset uploads if dry-run
      # follows latest (404 on platform archives still mid-matrix upload).
      # Use `make print-sfetch-version` so make expands the pin (any semver shape).
      - name: Test install script
        run: |
          set -euo pipefail
          TAG=$(make -s print-sfetch-version)
          test -n "$TAG"
          echo "Install smoke pin: $TAG (make print-sfetch-version)"
          bash scripts/install-sfetch.sh --dry-run --tag "$TAG" --require-minisign

      - name: Live verified bootstrap (N-1 minisig/current-key route)
        run: |
          set -euo pipefail
          TAG=$(make -s print-sfetch-version)
          DEST="$RUNNER_TEMP/sfetch-bootstrap-live"
          mkdir -p "$DEST"
          ./scripts/bootstrap-sfetch-verified.sh --version "$TAG" --dir "$DEST" --yes
          "$DEST/sfetch" --version

  # Five-way native go test. `platforms` is the stable aggregate required
  # check. Named *-s runners are org-hosted; labels are the pin.
  native:
    name: native (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-amd64
          - runner: ubuntu-latest-arm64-s
            target: linux-arm64
          - runner: macos-15
            target: darwin-arm64
          - runner: windows-2022
            target: windows-amd64
          - runner: windows-latest-arm64-s
            target: windows-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: '1.26.10'

      - name: Assert runner matches matrix target
        shell: bash
        run: |
          set -euo pipefail
          host="$(go env GOHOSTOS)/$(go env GOHOSTARCH)"
          case "${{ matrix.target }}" in
            linux-amd64) test "$host" = "linux/amd64" ;;
            linux-arm64) test "$host" = "linux/arm64" ;;
            darwin-arm64) test "$host" = "darwin/arm64" ;;
            windows-amd64) test "$host" = "windows/amd64" ;;
            windows-arm64) test "$host" = "windows/arm64" ;;
            *) echo "::error::unknown matrix target ${{ matrix.target }}"; exit 1 ;;
          esac
          echo "runner host $host matches ${{ matrix.target }}"

      - name: Native go test
        shell: bash
        run: |
          set -euo pipefail
          go env GOOS GOARCH
          go test ./...

      - name: Native installer GPG suites
        if: matrix.target == 'darwin-arm64'
        shell: bash
        run: |
          set -euo pipefail
          command -v gpg >/dev/null 2>&1 || brew install gnupg
          command -v minisign >/dev/null 2>&1 || brew install minisign
          command -v python3 >/dev/null 2>&1 || brew install python
          command -v gpg
          command -v minisign
          # Default runner TMPDIR (often /var/folders/.../T). Do not set TMPDIR=/tmp.
          ./scripts/test-install-anchor-select.sh
          ./scripts/test-install-gpg-mutants.sh

  platforms:
    name: platforms
    if: always()
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - name: Require all native platforms
        run: test "${{ needs.native.result }}" = "success"

  # Dual-route consumer matrix: action thin-wraps the shared engine.
  # Default pin exercises minisig (v0.4.11+). Ubuntu also proves sha256sums on v0.4.10.
  setup-sfetch-matrix:
    name: setup-sfetch (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: macos-15
          - os: windows-2022
          # Named org runner when available
          - os: windows-latest-arm64-s
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - name: Setup sfetch via composite action (v0.4.11 minisig route)
        uses: ./.github/actions/setup-sfetch
        with:
          sfetch-version: v0.4.11

      - name: Assert sfetch on PATH
        shell: bash
        run: |
          set -euo pipefail
          command -v sfetch
          # sfetch --version writes to stderr (not stdout)
          sfetch --version 2>&1 | tee /tmp/sfetch-ver.txt
          grep -E '0\.4\.11' /tmp/sfetch-ver.txt

      - name: Fail-closed optional tool (goneat not requested)
        shell: bash
        run: |
          set -euo pipefail
          # goneat must not be soft-installed when not requested
          if command -v goneat >/dev/null 2>&1; then
            echo "note: ambient goneat present on runner (not installed by action)"
          else
            echo "goneat absent as expected when goneat-version omitted"
          fi

      - name: Fail-closed when requested goneat is unavailable
        shell: bash
        run: |
          set -euo pipefail
          # Request a non-existent goneat tag; engine must exit non-zero (no soft skip).
          if ./scripts/bootstrap-sfetch-verified.sh \
              --version v0.4.11 \
              --dir "$RUNNER_TEMP/goneat-fail" \
              --goneat-version v0.0.0 \
              --yes; then
            echo "error: requested unavailable goneat must fail closed" >&2
            exit 1
          fi
          echo "requested-goneat failure path OK"

      - name: Backward pin v0.4.10 sha256sums route (ubuntu only)
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-sfetch
        with:
          sfetch-version: v0.4.10
          install-dir: ${{ runner.temp }}/sfetch-v0410

      - name: Assert backward pin binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/sfetch-v0410/sfetch" --version 2>&1 | tee /tmp/sfetch-0410.txt
          grep -E '0\.4\.10' /tmp/sfetch-0410.txt

      - name: Reject floating sfetch-version
        shell: bash
        run: |
          set -euo pipefail
          # Exercise engine reject path directly (action would also fail)
          if ./scripts/bootstrap-sfetch-verified.sh --version latest --dir "$RUNNER_TEMP/bad" --yes; then
            echo "error: latest must be rejected" >&2
            exit 1
          fi

  container-probe:
    name: Install probe (container)
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - name: Install prerequisites
        shell: bash
        run: |
          set -euo pipefail
          apt-get update && \
            apt-get install -y --no-install-recommends \
            ca-certificates git minisign

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: '1.26.10'

      - name: Build sfetch (from this commit)
        shell: bash
        run: |
          set -euo pipefail
          go build -o /usr/local/bin/sfetch .
          sfetch --version

      - name: Install goneat (verified)
        shell: bash
        run: |
          set -euo pipefail
          BIN_DIR="$HOME/.local/bin"
          CACHE_DIR="$HOME/.cache/sfetch"
          mkdir -p "$BIN_DIR" "$CACHE_DIR"
          export PATH="$BIN_DIR:$PATH"

          sfetch --repo fulmenhq/goneat \
            --tag v0.6.6 \
            --dest-dir "$BIN_DIR" \
            --cache-dir "$CACHE_DIR" \
            --require-minisign \
            --minisign-key "$GITHUB_WORKSPACE/docs/security/fulmenhq-goneat-minisign.pub"

          goneat version

  windows-dogfood-x64:
    name: Windows dogfood (x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: '1.26.10'

      # Pinned official minisign 0.12 archive (no Chocolatey/winget).
      - name: Install pinned minisign 0.12
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/acquire-minisign-pinned.sh --dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build sfetch
        shell: pwsh
        run: |
          go build -o bin/sfetch.exe .
          .\bin\sfetch.exe --version

      - name: Install goneat via sfetch
        shell: pwsh
        run: |
          .\bin\sfetch.exe `
            --repo fulmenhq/goneat `
            --tag v0.6.6 `
            --dest-dir bin `
            --require-minisign `
            --minisign-key docs/security/fulmenhq-goneat-minisign.pub
          .\bin\goneat.exe version

  windows-dogfood-arm64:
    name: Windows dogfood (arm64)
    runs-on: windows-latest-arm64-s
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: '1.26.10'

      # Pinned official minisign 0.12 archive (no Chocolatey/winget).
      - name: Install pinned minisign 0.12
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/acquire-minisign-pinned.sh --dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build sfetch
        shell: pwsh
        run: |
          go build -o bin/sfetch.exe .
          .\bin\sfetch.exe --version

      - name: Verify install script detects windows arm64
        shell: bash
        run: |
          set -euo pipefail
          lib="$(mktemp)"
          sed '$d' scripts/install-sfetch.sh > "$lib"
          printf '\ndetect_platform\n' >> "$lib"
          platform="$(bash "$lib" | tr -d '\r\n')"
          echo "Detected platform via install-sfetch.sh: $platform"
          test "$platform" = "windows_arm64"

      - name: Install goneat via sfetch
        shell: pwsh
        run: |
          .\bin\sfetch.exe `
            --repo fulmenhq/goneat `
            --tag v0.6.6 `
            --dest-dir bin `
            --require-minisign `
            --minisign-key docs/security/fulmenhq-goneat-minisign.pub
          .\bin\goneat.exe version
