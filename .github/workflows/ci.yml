---
name: CI

'on':
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}
  GH_TOKEN: ${{ github.token }}
  SFETCH_GITHUB_TOKEN: ${{ github.token }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'

      - name: Install system tools
        run: |
          sudo apt-get update && \
            sudo apt-get install -y --no-install-recommends \
            yamllint shellcheck minisign

      - name: Build sfetch (from this commit)
        run: |
          go build -o bin/sfetch .
          ./bin/sfetch --version

      - name: Install goneat via sfetch (dogfooding)
        run: |
          ./bin/sfetch --repo fulmenhq/goneat \
            --tag v0.5.15 \
            --dest-dir bin \
            --require-minisign
          ./bin/goneat version

      - name: Install development tools via goneat
        run: |
          export PATH="$PWD/bin:$PATH"
          goneat doctor tools --scope foundation --install --yes || true
          goneat doctor tools --scope security --install --yes || true

      - name: Quality
        run: |
          export PATH="$PWD/bin:$PATH"
          make precommit

      # Pin to Makefile SFETCH_VERSION (N-1 fully-signed release), never latest.
      # Main CI after a release tag races incomplete asset uploads if dry-run
      # follows latest (404 on platform archives still mid-matrix upload).
      # Use `make print-sfetch-version` so make expands the pin (any semver shape).
      - name: Test install script
        run: |
          set -euo pipefail
          TAG=$(make -s print-sfetch-version)
          test -n "$TAG"
          echo "Install smoke pin: $TAG (make print-sfetch-version)"
          bash scripts/install-sfetch.sh --dry-run --tag "$TAG" --require-minisign

      - name: Live verified bootstrap (N-1 SHA256SUMS route)
        run: |
          set -euo pipefail
          TAG=$(make -s print-sfetch-version)
          DEST="$RUNNER_TEMP/sfetch-bootstrap-live"
          mkdir -p "$DEST"
          ./scripts/bootstrap-sfetch-verified.sh --version "$TAG" --dir "$DEST" --yes
          "$DEST/sfetch" --version

  # Dual-route consumer matrix: action thin-wraps the shared engine.
  # Default pin exercises minisig (v0.4.11+). Ubuntu also proves sha256sums on v0.4.10.
  setup-sfetch-matrix:
    name: setup-sfetch (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
          # Named org runner when available
          - os: windows-latest-arm64-s
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup sfetch via composite action (v0.4.11 minisig route)
        uses: ./.github/actions/setup-sfetch
        with:
          sfetch-version: v0.4.11

      - name: Assert sfetch on PATH
        shell: bash
        run: |
          set -euo pipefail
          command -v sfetch
          # sfetch --version writes to stderr (not stdout)
          sfetch --version 2>&1 | tee /tmp/sfetch-ver.txt
          grep -E '0\.4\.11' /tmp/sfetch-ver.txt

      - name: Fail-closed optional tool (goneat not requested)
        shell: bash
        run: |
          set -euo pipefail
          # goneat must not be soft-installed when not requested
          if command -v goneat >/dev/null 2>&1; then
            echo "note: ambient goneat present on runner (not installed by action)"
          else
            echo "goneat absent as expected when goneat-version omitted"
          fi

      - name: Fail-closed when requested goneat is unavailable
        shell: bash
        run: |
          set -euo pipefail
          # Request a non-existent goneat tag; engine must exit non-zero (no soft skip).
          if ./scripts/bootstrap-sfetch-verified.sh \
              --version v0.4.11 \
              --dir "$RUNNER_TEMP/goneat-fail" \
              --goneat-version v0.0.0 \
              --yes; then
            echo "error: requested unavailable goneat must fail closed" >&2
            exit 1
          fi
          echo "requested-goneat failure path OK"

      - name: Backward pin v0.4.10 sha256sums route (ubuntu only)
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-sfetch
        with:
          sfetch-version: v0.4.10
          install-dir: ${{ runner.temp }}/sfetch-v0410

      - name: Assert backward pin binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/sfetch-v0410/sfetch" --version 2>&1 | tee /tmp/sfetch-0410.txt
          grep -E '0\.4\.10' /tmp/sfetch-0410.txt

      - name: Reject floating sfetch-version
        shell: bash
        run: |
          set -euo pipefail
          # Exercise engine reject path directly (action would also fail)
          if ./scripts/bootstrap-sfetch-verified.sh --version latest --dir "$RUNNER_TEMP/bad" --yes; then
            echo "error: latest must be rejected" >&2
            exit 1
          fi

  container-probe:
    name: Install probe (container)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install prerequisites
        shell: bash
        run: |
          set -euo pipefail
          apt-get update && \
            apt-get install -y --no-install-recommends \
            ca-certificates git minisign

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'

      - name: Build sfetch (from this commit)
        shell: bash
        run: |
          set -euo pipefail
          go build -o /usr/local/bin/sfetch .
          sfetch --version

      - name: Install goneat (verified)
        shell: bash
        run: |
          set -euo pipefail
          BIN_DIR="$HOME/.local/bin"
          CACHE_DIR="$HOME/.cache/sfetch"
          mkdir -p "$BIN_DIR" "$CACHE_DIR"
          export PATH="$BIN_DIR:$PATH"

          sfetch --repo fulmenhq/goneat \
            --tag v0.5.15 \
            --dest-dir "$BIN_DIR" \
            --cache-dir "$CACHE_DIR" \
            --require-minisign

          goneat version

  windows-dogfood-x64:
    name: Windows dogfood (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'

      # Pinned official minisign 0.12 archive (no Chocolatey/winget).
      - name: Install pinned minisign 0.12
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/acquire-minisign-pinned.sh --dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build sfetch
        shell: pwsh
        run: |
          go build -o bin/sfetch.exe .
          .\bin\sfetch.exe --version

      - name: Install goneat via sfetch
        shell: pwsh
        run: |
          .\bin\sfetch.exe `
            --repo fulmenhq/goneat `
            --tag v0.5.15 `
            --dest-dir bin `
            --require-minisign
          .\bin\goneat.exe version

  windows-dogfood-arm64:
    name: Windows dogfood (arm64)
    runs-on: windows-latest-arm64-s
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'

      # Pinned official minisign 0.12 archive (no Chocolatey/winget).
      - name: Install pinned minisign 0.12
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/acquire-minisign-pinned.sh --dir "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build sfetch
        shell: pwsh
        run: |
          go build -o bin/sfetch.exe .
          .\bin\sfetch.exe --version

      - name: Verify install script detects windows arm64
        shell: bash
        run: |
          set -euo pipefail
          lib="$(mktemp)"
          sed '$d' scripts/install-sfetch.sh > "$lib"
          printf '\ndetect_platform\n' >> "$lib"
          platform="$(bash "$lib" | tr -d '\r\n')"
          echo "Detected platform via install-sfetch.sh: $platform"
          test "$platform" = "windows_arm64"

      - name: Install goneat via sfetch
        shell: pwsh
        run: |
          .\bin\sfetch.exe `
            --repo fulmenhq/goneat `
            --tag v0.5.15 `
            --dest-dir bin `
            --require-minisign
          .\bin\goneat.exe version
